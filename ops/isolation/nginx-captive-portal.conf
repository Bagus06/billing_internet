server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/isolation;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "isolation-server-ok\n";
    }

    # Android / ChromeOS connectivity checks.
    location ~ ^/(generate_204|gen_204)$ {
        return 302 http://10.5.5.3/;
    }

    # Apple CNA connectivity checks.
    location ~ ^/(hotspot-detect\.html|library/test/success\.html)$ {
        return 302 http://10.5.5.3/;
    }

    # Windows NCSI connectivity checks.
    location ~ ^/(connecttest\.txt|redirect|ncsi\.txt)$ {
        return 302 http://10.5.5.3/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
